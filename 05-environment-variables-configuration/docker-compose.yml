services:
  api:
    build: .
    container_name: env-config-api
    ports: ["8000:8000"]
    env_file: [.env]
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql:9.7
    env_file: [.env]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-uroot","-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
    name: mysql_data
